{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<h1>Вход</h1>
<form method="post" class="card p-4" style="max-width:400px">{% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
        <div class="mb-3">
            <label class="form-label">
                {% if field.name == 'username' %}Логин или email{% else %}{{ field.label }}{% endif %}
            </label>
            <input type="{% if field.name == 'password' %}password{% else %}text{% endif %}"
                   name="{{ field.name }}" class="form-control" required>
            {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
        </div>
    {% endfor %}
    <button class="btn btn-success">Войти</button>
    <a href="{% url 'register' %}" class="btn btn-link">Регистрация</a>
</form>
{% endblock %}
